{
  "version": 1,
  "format_note": "JSON-compatible YAML 1.2; stdlib json loader is sufficient",
  "state_classes": ["OBSERVED", "OPERATIONAL", "DERIVED"],
  "states": {
    "trading_gate": ["CLOSED", "OPEN", "HALTED", "UNKNOWN"],
    "kill_switch": ["OFF", "ON"],
    "reconciliation": ["MATCH", "MISMATCH", "UNKNOWN"],
    "order": [
      "CREATED",
      "SUBMITTING",
      "SUBMITTED",
      "PARTIALLY_FILLED",
      "FILLED",
      "CANCELED",
      "REJECTED",
      "UNKNOWN"
    ]
  },
  "transitions": {
    "order": {
      "CREATED": {"SUBMIT_REQUESTED": "SUBMITTING"},
      "SUBMITTING": {
        "BROKER_ACCEPTED": "SUBMITTED",
        "BROKER_REJECTED": "REJECTED",
        "TIMEOUT": "UNKNOWN"
      },
      "SUBMITTED": {
        "PARTIAL_FILL": "PARTIALLY_FILLED",
        "FULL_FILL": "FILLED",
        "CANCEL_ACCEPTED": "CANCELED"
      },
      "PARTIALLY_FILLED": {
        "FULL_FILL": "FILLED",
        "CANCEL_ACCEPTED": "CANCELED"
      },
      "UNKNOWN": {
        "BROKER_FOUND_SUBMITTED": "SUBMITTED",
        "BROKER_FOUND_PARTIAL": "PARTIALLY_FILLED",
        "BROKER_FOUND_FILLED": "FILLED",
        "BROKER_FOUND_CANCELED": "CANCELED",
        "BROKER_FOUND_REJECTED": "REJECTED"
      }
    }
  },
  "constraints": [
    {"id": "NO_DRAFT_TO_SIZING", "kind": "ARCHITECTURE"},
    {"id": "NO_UNAPPROVED_INTENT", "kind": "ARCHITECTURE"},
    {"id": "NO_NEW_RISK_WHEN_GATE_NOT_OPEN", "kind": "SAFETY"},
    {"id": "NO_NEW_RISK_WHEN_KILL_SWITCH_ON", "kind": "SAFETY"},
    {"id": "NO_NEW_RISK_WHEN_RECONCILIATION_NOT_MATCH", "kind": "SAFETY"},
    {"id": "NO_NEW_RISK_WHEN_AUDIT_UNHEALTHY", "kind": "SAFETY"},
    {"id": "NO_AUTO_RESUBMIT_WHEN_ORDER_UNKNOWN", "kind": "ARCHITECTURE"},
    {"id": "NO_RAW_SYMBOL_QTY_PRICE_SUBMIT_CLI", "kind": "ARCHITECTURE"},
    {"id": "NO_IMPLICIT_PAPER_TO_LIVE_PROMOTION", "kind": "ARCHITECTURE"}
  ],
  "coordinates": {
    "time": ["as_of", "fetched_at"],
    "optional_time": ["occurred_at", "published_at", "recorded_at"],
    "market": ["market", "environment", "account_ref"],
    "actor": ["actor", "source"],
    "policy": ["policy_version"]
  },
  "authorities": {
    "cash": "BROKER",
    "holdings": "BROKER",
    "broker_order": "BROKER",
    "fill": "BROKER",
    "order_state": "LEDGER",
    "control_state": "LEDGER",
    "allowed_rules": "POLICY_BUNDLE",
    "limits": "POLICY_BUNDLE",
    "who_when_why": "AUDIT"
  },
  "record_types": ["OBSERVATION", "JUDGMENT", "PROPOSAL", "EVENT"],
  "commit_types": ["CONTROL_COMMIT", "ECONOMIC_COMMIT"]
}
